<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<link rel="stylesheet" type="text/css" href="Style.css">
	<style type="text/css">
		h1 {
			text-align: center;
		}
		iframe {
			width: 100%;
			height: 100%;
			border: none;
		}
		div {
			height: 100%;
		}
		html,body {
			height: 265%;
		}
		img {
			width: 100%;
			height: 100%;
		}
	</style>
</head>
<body class="slide-in-fwd-top">
	<h1>Handphone</h1>
		<hr width="100%">
		<div style="display: grid;grid-template-rows: 21% 19% 30% 30%;">
			<iframe src="Handphone/Iphone/iphone.html" scrolling="no"></iframe>
			<iframe src="Handphone/Poco/poco.html" scrolling="no"></iframe>
			<iframe src="Handphone/Samsung/samsung.html" scrolling="no"></iframe>

		</div>
		<hr width="100%">

		<div style="display: grid;grid-template-rows: 23% 25% 27% 25%;">
			<iframe src="Laptop/Acer/Acer.html" scrolling="no"></iframe>
			<iframe src="Laptop/Asus/Asus.html" scrolling="no"></iframe>
			<iframe src="Laptop/HP/HP.html" scrolling="no"></iframe>
			<iframe src="Laptop/Lenovo/Lenovo.html" scrolling="no"></iframe>

</html>
