<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<style type="text/css">
		@keyframes slide-in-fwd-top {
  0% {
    -webkit-transform: translateZ(-1400px) translateY(-800px);
            transform: translateZ(-1400px) translateY(-800px);
    opacity: 0;
  }
  100% {
    -webkit-transform: translateZ(0) translateY(0);
            transform: translateZ(0) translateY(0);
    opacity: 1;
  }
}
@keyframes slide-in-fwd-top {
  0% {
    -webkit-transform: translateZ(-1400px) translateY(-800px);
            transform: translateZ(-1400px) translateY(-800px);
    opacity: 0;
  }
  100% {
    -webkit-transform: translateZ(0) translateY(0);
            transform: translateZ(0) translateY(0);
    opacity: 1;
  }
}
.slide-in-fwd-top {
	-webkit-animation: slide-in-fwd-top 1.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
	        animation: slide-in-fwd-top 1.5s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
}
		iframe {
			width: 100%;
			height: 100%;
			border: none;
		}
		html,body {
			height: 250%;
		}
		div {
			height: 100%;
		}
	</style>
</head>
<body class="slide-in-fwd-top">
	<div style="display: grid;grid-template-rows: 21% 19% 30% 30%;">
		<iframe src="Iphone/iphone.html"></iframe>
		<iframe src="Poco/poco.html"></iframe>
		<iframe src="Samsung/samsung.html"></iframe>
		<iframe src="Xiaomi/xiaomi.html"></iframe>
	</div>
</body>
</html>
