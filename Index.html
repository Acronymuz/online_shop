<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Electronic Shop</title>
	<link rel="icon" type="image" href="Assets\CPU.png">
	<link rel="stylesheet" type="text/css" href="Style.css">
	<style type="text/css">
		html, body {
			height: 100%;
			margin: 0px;
		}
		iframe {
			width: 100%;
			height: 100%;
			border: none;
			color: white;
		}
		.wallpaper {
			background-image: url("Assets/Wallpaper Content.jpg");
		}
		.main-wallpaper {
			background-image: url("Assets/Black-Wallpaper.jpg");
		}
	</style>
</head>
<body class="main-wallpaper">
	<div style="height: 100%;display: grid;grid-template-rows: 20% 70% 10%;">
		<div style="display: grid;grid-template-columns: 20% 80%;">
			<iframe src="Icon.html"></iframe>
			<iframe src="Top.html"></iframe>
		</div>
		<div style="display: grid;grid-template-columns: 20% 80%;">
			<iframe src="Button.html"></iframe>
			<iframe src="Content.html" name="content" class="wallpaper scale-up-center"></iframe>
		</div>
		<iframe src="Foot.html" scrolling="no"></iframe>
	</div>
</body>
</html>
